name: tempo-api-production

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - tempo_production_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    command: ['--webroot=/tempo/mailpit/']
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz', '--webroot', '/tempo/mailpit/']
    ports:
      # EMAIL_PORT/EMAIL_UI_PORT are container ports; host ports are separate
      # so test and development can continue using 1025/8025.
      - '127.0.0.1:${EMAIL_HOST_PORT:?EMAIL_HOST_PORT must be set}:${EMAIL_PORT}'
      - '127.0.0.1:${EMAIL_UI_HOST_PORT:?EMAIL_UI_HOST_PORT must be set}:${EMAIL_UI_PORT}'

  api:
    image: ${TEMPO_API_IMAGE:?TEMPO_API_IMAGE must be set}
    restart: unless-stopped
    env_file:
      - ${TEMPO_PRODUCTION_ENV_FILE:-/etc/tempo/production.env}
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      EMAIL_HOST: mailpit
      ENABLE_BANKING_PRIVATE_KEY_PATH: /run/secrets/enable-banking-private.key
    volumes:
      - type: bind
        source: ${ENABLE_BANKING_PRIVATE_KEY_HOST_PATH}
        target: /run/secrets/enable-banking-private.key
        read_only: true
    expose:
      - '3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:3000/health']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    image: ${TEMPO_WEB_IMAGE:?TEMPO_WEB_IMAGE must be set}
    restart: unless-stopped
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/tempo/']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  tempo_production_postgres_data:
