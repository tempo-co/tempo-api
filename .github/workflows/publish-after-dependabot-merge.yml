name: Publish image after Dependabot merge

on:
    repository_dispatch:
        types:
            - dependabot-patch-merged
    workflow_dispatch:
        inputs:
            pull_number:
                description: Merged Dependabot PR number
                required: true
                type: string
            head_sha:
                description: Dependabot PR head SHA at merge
                required: true
                type: string
            merge_commit_sha:
                description: Merge commit SHA on main
                required: true
                type: string

jobs:
    verify-merged-pr:
        if: github.repository == 'tempo-co/tempo-api'
        permissions:
            pull-requests: read
        runs-on: ubuntu-latest
        outputs:
            pull_number: ${{ steps.verify.outputs.pull_number }}
        steps:
            - name: Verify merged Dependabot patch event
              id: verify
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              with:
                  script: |
                      const payload = context.eventName === 'repository_dispatch'
                          ? context.payload.client_payload ?? {}
                          : context.payload.inputs ?? {};
                      const pullNumber = Number(payload.pull_number);
                      const validSha = (value) => typeof value === 'string' && /^[0-9a-f]{40}$/.test(value);

                      if (context.eventName === 'repository_dispatch' && context.payload.action !== 'dependabot-patch-merged') {
                          core.setFailed('Unexpected repository_dispatch type.');
                          return;
                      }
                      if (context.eventName === 'workflow_dispatch' && context.ref !== 'refs/heads/main') {
                          core.setFailed('Manual image publication must run from main.');
                          return;
                      }
                      if (!Number.isSafeInteger(pullNumber) || pullNumber < 1 || !validSha(payload.head_sha) || !validSha(payload.merge_commit_sha)) {
                          core.setFailed('Dispatch payload is missing a valid PR number or commit SHA.');
                          return;
                      }

                      const { data: pullRequest } = await github.rest.pulls.get({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          pull_number: pullNumber,
                      });
                      if (pullRequest.user.login !== 'dependabot[bot]' || pullRequest.base.ref !== 'main' || !pullRequest.merged_at ||
                          pullRequest.head.sha !== payload.head_sha || pullRequest.merge_commit_sha !== payload.merge_commit_sha) {
                          core.setFailed('The dispatch does not match a merged Dependabot PR on main.');
                          return;
                      }

                      core.setOutput('pull_number', String(pullNumber));

    publish-image:
        needs: verify-merged-pr
        concurrency:
            group: tempo-api-main-image-publish
            cancel-in-progress: true
        permissions:
            contents: read
            packages: write
        runs-on: ubuntu-latest
        steps:
            - name: Checkout current main
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ github.sha }}
                  persist-credentials: false

            - name: Log in to GitHub Container registry
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push current main image
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
              with:
                  context: .
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/tempo-api:latest
                      ghcr.io/${{ github.repository_owner }}/tempo-api:${{ github.sha }}
                  labels: |
                      org.opencontainers.image.source=https://github.com/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}

    resolve-image-publish-blocker:
        needs: [verify-merged-pr, publish-image]
        if: needs.publish-image.result == 'success'
        permissions:
            issues: write
            pull-requests: write
        runs-on: ubuntu-latest
        steps:
            - name: Close any previous image-publish blocker
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              with:
                  script: |
                      const owner = context.repo.owner;
                      const repo = context.repo.repo;
                      const pullNumber = Number('${{ needs.verify-merged-pr.outputs.pull_number }}');
                      const marker = `<!-- dependabot-image-publish:pr-${pullNumber} -->`;
                      const issues = await github.paginate(github.rest.issues.listForRepo, {
                          owner, repo, state: 'all', labels: 'image-publish-blocked', per_page: 100,
                      });
                      const issue = issues.find((item) => !item.pull_request && item.body?.includes(marker));
                      if (issue?.state === 'open') {
                          await github.rest.issues.createComment({
                              owner, repo, issue_number: issue.number,
                              body: `The image publish workflow succeeded for merged Dependabot PR #${pullNumber}. Closing this blocker.`,
                          });
                          await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
                      }
                      try {
                          await github.rest.issues.removeLabel({ owner, repo, issue_number: pullNumber, name: 'image-publish-blocked' });
                      } catch (error) {
                          if (error.status !== 404) throw error;
                      }

    report-image-publish-failure:
        needs: [verify-merged-pr, publish-image]
        if: always() && needs.verify-merged-pr.result == 'success' && needs.publish-image.result == 'failure'
        permissions:
            issues: write
            pull-requests: write
        runs-on: ubuntu-latest
        steps:
            - name: Track failed image publication
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              with:
                  script: |
                      const owner = context.repo.owner;
                      const repo = context.repo.repo;
                      const pullNumber = Number('${{ needs.verify-merged-pr.outputs.pull_number }}');
                      const labelName = 'image-publish-blocked';
                      const trackerMarker = `<!-- dependabot-image-publish:pr-${pullNumber} -->`;
                      const { data: pullRequest } = await github.rest.pulls.get({ owner, repo, pull_number: pullNumber });

                      const labels = await github.paginate(github.rest.issues.listLabelsForRepo, { owner, repo, per_page: 100 });
                      if (!labels.some((label) => label.name === labelName)) {
                          try {
                              await github.rest.issues.createLabel({
                                  owner, repo, name: labelName, color: 'd73a4a',
                                  description: 'GHCR image publication failed after a Dependabot merge',
                              });
                          } catch (error) {
                              if (error.status !== 422) throw error;
                          }
                      }

                      const issues = await github.paginate(github.rest.issues.listForRepo, {
                          owner, repo, state: 'all', labels: labelName, per_page: 100,
                      });
                      const issue = issues.find((item) => !item.pull_request && item.body?.includes(trackerMarker));
                      const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
                      const body = [
                          trackerMarker,
                          `The GHCR image publication failed after merged Dependabot PR [#${pullNumber}](${pullRequest.html_url}).`,
                          '',
                          `Workflow run: [${runUrl}](${runUrl})`,
                          `PR head SHA: ${pullRequest.head.sha}`,
                          `Merge commit SHA: ${pullRequest.merge_commit_sha}`,
                          '',
                          'Review the failed build/push job, then rerun this workflow from main with the PR number and both SHAs after resolving the cause. The production image may still be on the previous published version.',
                      ].join('\n');

                      await github.rest.issues.addLabels({ owner, repo, issue_number: pullNumber, labels: [labelName] });

                      let trackerIssue;
                      if (issue) {
                          const update = { owner, repo, issue_number: issue.number, title: `Image publish blocked: Dependabot PR #${pullNumber}`, body };
                          if (issue.state !== 'open') update.state = 'open';
                          trackerIssue = (await github.rest.issues.update(update)).data;
                      } else {
                          trackerIssue = (await github.rest.issues.create({
                              owner, repo, title: `Image publish blocked: Dependabot PR #${pullNumber}`,
                              body, labels: [labelName],
                          })).data;
                      }

                      const commentMarker = `<!-- dependabot-image-publish-run:${context.runId} -->`;
                      const comments = await github.paginate(github.rest.issues.listComments, {
                          owner, repo, issue_number: pullNumber, per_page: 100,
                      });
                      if (!comments.some((comment) => comment.body?.includes(commentMarker))) {
                          await github.rest.issues.createComment({
                              owner, repo, issue_number: pullNumber,
                              body: `${commentMarker}\nImage publication failed after merge. Track progress in [issue #${trackerIssue.number}](${trackerIssue.html_url}).`,
                          });
                      }
