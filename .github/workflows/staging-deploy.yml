name: Deploy API PR to staging

on:
    workflow_dispatch:
        inputs:
            pr_number:
                description: Open API pull request number
                required: true
                type: number

permissions:
    actions: read
    contents: read
    checks: read
    pull-requests: read
    statuses: read

jobs:
    verify-pr:
        name: Verify API PR
        runs-on: ubuntu-latest
        outputs:
            head_sha: ${{ steps.pr.outputs.head_sha }}
        steps:
            - name: Verify PR head and checks
              id: pr
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR_NUMBER: ${{ inputs.pr_number }}
              run: |
                  set -euo pipefail
                  repo="$GITHUB_REPOSITORY"
                  pr="$PR_NUMBER"
                  pr_json="$(gh api "repos/$repo/pulls/$pr")"
                  head_repo="$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")"
                  head_sha="$(jq -r '.head.sha // ""' <<<"$pr_json")"
                  base_ref="$(jq -r '.base.ref // ""' <<<"$pr_json")"
                  state="$(jq -r '.state // ""' <<<"$pr_json")"
                  draft="$(jq -r '.draft' <<<"$pr_json")"

                  [[ "$repo" == tempo-co/tempo-api ]]
                  [[ "$GITHUB_REF" == refs/heads/main ]]
                  [[ "$head_repo" == "$repo" ]]
                  [[ "$base_ref" == main ]]
                  [[ "$state" == open ]]
                  [[ "$draft" == false ]]
                  [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]

                  trusted_workflow_id=102921081
                  main_ci_sha="$(gh api "repos/$repo/contents/.github/workflows/ci.yml?ref=main" --jq '.sha')"
                  head_ci_sha="$(gh api "repos/$repo/contents/.github/workflows/ci.yml?ref=$head_sha" --jq '.sha')"
                  [[ "$head_ci_sha" == "$main_ci_sha" ]]
                  runs_json="$(gh api --paginate "repos/$repo/actions/runs?head_sha=$head_sha&per_page=100" --jq '.workflow_runs[]' | jq -s '{workflow_runs: .}')"
                  trusted_run_json="$(jq -c --argjson workflow_id "$trusted_workflow_id" --arg head_sha "$head_sha" '[.workflow_runs[] | select(.workflow_id == $workflow_id and .head_sha == $head_sha and .path == ".github/workflows/ci.yml" and .check_suite_id != null)] | max_by(.id) // empty' <<<"$runs_json")"
                  [[ -n "$trusted_run_json" ]]
                  [[ "$(jq -r '.status' <<<"$trusted_run_json")" == completed ]]
                  [[ "$(jq -r '.conclusion' <<<"$trusted_run_json")" == success ]]
                  trusted_suite_id="$(jq -r '.check_suite_id' <<<"$trusted_run_json")"

                  checks_json="$(gh api --paginate "repos/$repo/commits/$head_sha/check-runs?per_page=100" --jq '.check_runs[]' | jq -s '{check_runs: .}')"
                  statuses_json="$(gh api --paginate "repos/$repo/commits/$head_sha/status?per_page=100" --jq '.statuses[]' | jq -s '{statuses: .}')"
                  check_count="$(jq --argjson suite_id "$trusted_suite_id" '[.check_runs[] | select(.check_suite.id == $suite_id)] | length' <<<"$checks_json")"
                  status_count="$(jq '.statuses | length' <<<"$statuses_json")"
                  failed_checks="$(jq --argjson suite_id "$trusted_suite_id" '[.check_runs[] | select(.check_suite.id == $suite_id and (.status != "completed" or (.conclusion | IN("success", "neutral", "skipped") | not)))] | length' <<<"$checks_json")"
                  failed_statuses="$(jq '[.statuses[] | select(.state != "success")] | length' <<<"$statuses_json")"
                  missing_checks="$(jq -r --argjson suite_id "$trusted_suite_id" --argjson required '["Lint & Format", "Build", "Unit Tests", "E2E Tests"]' '[ $required[] as $name | select(([.check_runs[] | select(.check_suite.id == $suite_id and .name == $name and .status == "completed" and .conclusion == "success")] | length) == 0) | $name ] | join(",")' <<<"$checks_json")"

                  (( check_count > 0 ))
                  (( failed_checks == 0 ))
                  (( failed_statuses == 0 ))
                  [[ -z "$missing_checks" ]]
                  printf 'head_sha=%s\n' "$head_sha" >> "$GITHUB_OUTPUT"
            - name: Checkout staging contracts
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Run staging contract tests
              run: |
                  bash ops/tests/tempo-staging-deploy-test.sh
                  bash ops/tests/tempo-staging-host-install-test.sh
                  bash ops/tests/tempo-staging-ssh-deploy-test.sh
                  bash ops/tests/tempo-staging-refresh-test.sh
                  bash ops/tests/tempo-staging-workflow-test.sh

    build:
        name: Build API image artifact
        runs-on: ubuntu-latest
        needs: [verify-pr]
        permissions:
            contents: read
        steps:
            - name: Checkout exact PR head
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ needs.verify-pr.outputs.head_sha }}
                  fetch-depth: 1
                  persist-credentials: false

            - name: Build immutable API image locally
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
              with:
                  context: .
                  platforms: linux/amd64
                  load: true
                  tags: tempo-staging-api:${{ needs.verify-pr.outputs.head_sha }}
                  labels: |
                      org.opencontainers.image.source=https://github.com/${{ github.repository }}
                      org.opencontainers.image.revision=${{ needs.verify-pr.outputs.head_sha }}

            - name: Save API image artifact
              run: docker save "tempo-staging-api:${{ needs.verify-pr.outputs.head_sha }}" | gzip > "$RUNNER_TEMP/tempo-api-image.tar.gz"

            - name: Upload API image artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: tempo-api-image-${{ needs.verify-pr.outputs.head_sha }}
                  path: ${{ runner.temp }}/tempo-api-image.tar.gz
                  retention-days: 1

    publish:
        name: Publish API image
        runs-on: ubuntu-latest
        needs: [verify-pr, build]
        permissions:
            contents: read
            packages: write
        outputs:
            digest: ${{ steps.digest.outputs.digest }}
        steps:
            - name: Download API image artifact
              uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
              with:
                  name: tempo-api-image-${{ needs.verify-pr.outputs.head_sha }}
                  path: ${{ runner.temp }}/tempo-api-image

            - name: Load API image artifact
              run: gzip -dc "$RUNNER_TEMP/tempo-api-image/tempo-api-image.tar.gz" | docker load

            - name: Log in to GitHub Container registry
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Push immutable API image
              env:
                  IMAGE_TAG: ghcr.io/${{ github.repository_owner }}/tempo-api:staging-pr-${{ inputs.pr_number }}-${{ needs.verify-pr.outputs.head_sha }}
                  LOCAL_TAG: tempo-staging-api:${{ needs.verify-pr.outputs.head_sha }}
              run: |
                  set -euo pipefail
                  docker tag "$LOCAL_TAG" "$IMAGE_TAG"
                  docker push "$IMAGE_TAG"

            - name: Resolve pushed API digest
              id: digest
              env:
                  IMAGE_TAG: ghcr.io/${{ github.repository_owner }}/tempo-api:staging-pr-${{ inputs.pr_number }}-${{ needs.verify-pr.outputs.head_sha }}
              run: |
                  set -euo pipefail
                  digest="$(docker manifest inspect --verbose "$IMAGE_TAG" | jq -r 'if type == "array" then .[0].Descriptor.digest else .Descriptor.digest end')"
                  [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
                  printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

    deploy:
        name: Promote API image to staging
        runs-on: ubuntu-latest
        needs: [verify-pr, publish]
        environment: staging
        steps:
            - name: Connect GitHub runner to the tailnet
              uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
              with:
                  oauth-client-id: ${{ secrets.STAGING_TAILSCALE_OAUTH_CLIENT_ID }}
                  oauth-secret: ${{ secrets.STAGING_TAILSCALE_OAUTH_SECRET }}
                  tags: tag:tempo-staging-deploy
                  ping: ${{ vars.STAGING_DEPLOY_HOST }}

            - name: Configure restricted SSH client
              env:
                  STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
                  STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
              run: |
                  set -euo pipefail
                  install -d -m 700 "$HOME/.ssh"
                  printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
                  printf '%s\n' "$STAGING_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
                  chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

            - name: Deploy exact API digest
              env:
                  DEPLOY_HOST: ${{ vars.STAGING_DEPLOY_HOST }}
                  DEPLOY_USER: ${{ vars.STAGING_DEPLOY_USER }}
                  PR_NUMBER: ${{ inputs.pr_number }}
                  HEAD_SHA: ${{ needs.verify-pr.outputs.head_sha }}
                  IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
              run: |
                  set -euo pipefail
                  [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
                  image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/tempo-api@${IMAGE_DIGEST}"
                  ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
                    "$DEPLOY_USER@$DEPLOY_HOST" \
                    "tempo-staging-ssh-deploy deploy api tempo-co/tempo-api $PR_NUMBER $HEAD_SHA $image"
